name: update-data
# Runs every 30 minutes via the Cloudflare Cron Trigger in cron/ (workflow_dispatch).
# GitHub's own schedule fired about 6 times in 2 days here, so it is not used.
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: update-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # cache/db.json carries the state between runs. A cache miss just triggers a fresh backfill.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: db-${{ github.run_id }}
          restore-keys: db-
      - name: Collect data
        run: node scripts/build-data.mjs
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: db-${{ github.run_id }}
      # Wrangler is pinned by package-lock.json; it is the only code that sees the Cloudflare token.
      - name: Deploy
        run: npm ci && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
